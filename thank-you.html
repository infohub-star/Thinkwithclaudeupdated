<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thank you — Shantanu Anand</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<!-- Paste your Google Ads tag (gtag.js) here so the conversion below can fire -->
<style>
*{box-sizing:border-box}
body{margin:0;background:#F7F9FC;color:#1A1A1A;font:16px/1.6 'Inter',sans-serif}
.w{max-width:760px;margin:0 auto;padding:56px 20px}
.tick{width:64px;height:64px;border-radius:50%;background:#ECF8F1;color:#1E7A4E;display:flex;align-items:center;justify-content:center;font-size:32px;margin-bottom:18px}
h1{font:700 clamp(28px,5vw,40px)/1.15 'DM Sans',sans-serif;color:#0B1B33;margin:0 0 10px}
.sub{color:#4A4A4A;margin:0 0 28px}
.card{background:#fff;border:1px solid rgba(15,23,42,.10);border-radius:18px;padding:24px;margin-bottom:20px}
.stat{background:#F7F9FC;border-radius:12px;padding:14px 16px;margin-bottom:16px}
.stat small{display:block;color:#6B6B6B;font-size:13px}.stat b{font:700 26px 'DM Sans',sans-serif;color:#0B1B33}
h2{font:700 19px 'DM Sans',sans-serif;color:#0B1B33;margin:6px 0 12px}
.wf{border:1px solid rgba(15,23,42,.10);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.top b{font-weight:600;color:#0B1B33}
.save{background:#ECF8F1;color:#1E7A4E;font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.tools span{background:#EEF2F7;color:#4A4A4A;font-size:12px;padding:4px 9px;border-radius:6px}
ol{margin:0;padding-left:20px;font-size:14px;line-height:1.7}
.prompt{background:#0B1B33;color:#E8EEF8;border-radius:12px;padding:14px;font:13px/1.6 ui-monospace,Menlo,monospace;white-space:pre-wrap}
.copy{margin-top:8px;background:#fff;border:1px solid rgba(15,23,42,.18);border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer}
.next{background:#0B1B33;color:#fff;border-radius:18px;padding:26px}
.next h2{color:#fff}.next p{color:#C9D3E3;margin:0 0 16px}
.btn{display:inline-block;background:#fff;color:#004AAD;text-decoration:none;font-weight:600;padding:13px 20px;border-radius:10px;margin:0 8px 8px 0}
.btn.alt{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.35)}
.back{display:inline-block;margin-top:22px;color:#004AAD;font-size:14px}
</style></head>
<body><main class="w">
  <div class="tick" aria-hidden="true">✓</div>
  <h1>Thank you, you're in</h1>
  <p class="sub" id="tysub">Shantanu will personally reach out within 24 hours with more AI workflows for your work.</p>
  <div id="res"></div>
  <div class="next">
    <h2>Want all these hours back?</h2>
    <p>Book a free 20-minute call. We'll look at your work and plan exactly what AI can take off your plate.</p>
    <a class="btn" href="https://calendly.com/infohub-connectwithshantanu/claude-session" target="_blank" rel="noopener">Book a free call</a>
  </div>
  <a class="back" href="/">← Back to the website</a>
</main>
<script>
/* Paste your Google Ads conversion label here, e.g. 'AW-123456789/AbCdEf' */
var ADS_CONVERSION='';
try{if(ADS_CONVERSION&&window.gtag)gtag('event','conversion',{send_to:ADS_CONVERSION})}catch(_){}
try{window.va&&window.va('event',{name:'thank_you_view'})}catch(_){}
function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
if(/src=callback/.test(location.search)){document.getElementById('tysub').textContent="Got it. We'll WhatsApp you within 24 hours to set up your free call."}
var d=null;try{d=JSON.parse(sessionStorage.getItem('tw_result'))}catch(_){}
if(d&&d.r&&d.r.workflows){var r=d.r;
  document.getElementById('res').innerHTML='<div class="card"><div class="stat"><small>Hours you could save as a '+esc(r.role)+'</small><b>'+Math.round(r.hours||0)+' hrs/week</b></div>'+
  '<h2>Your AI workflows</h2>'+r.workflows.map(function(w,i){return '<div class="wf"><div class="top"><b>Workflow '+(i+1)+': '+esc(w.name)+'</b><span class="save">Saves '+esc(w.saves)+'</span></div><div class="tools">'+(w.tools||[]).map(function(t){return '<span>'+esc(t)+'</span>'}).join('')+'</div><ol>'+(w.steps||[]).map(function(s){return '<li>'+esc(s)+'</li>'}).join('')+'</ol></div>'}).join('')+
  (r.prompt?'<h2 style="margin-top:18px">Try this prompt now</h2><div class="prompt">'+esc(r.prompt)+'</div><button class="copy" id="cp">Copy prompt</button>':'')+'</div>';
  var cp=document.getElementById('cp');if(cp)cp.onclick=function(){try{navigator.clipboard.writeText(r.prompt);cp.textContent='Copied'}catch(_){}};
}
</script>
</body></html>
